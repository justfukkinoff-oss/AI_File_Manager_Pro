name: Android Build CI

on:
  push:
    branches:
      - '*'
      - '!master'
      - '!release/*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_spotless:
    name: Check spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Rust for Android
        working-directory: file_operations
        run: bash ./setup_rust_android.sh --arm64

      - name: Assemble ARM64 debug APK
        run: ./gradlew :app:assembleFdroidDebug -Parm64Only=true --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          test -f "$apk"
          native_abis=$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | sort -u)
          test "$native_abis" = arm64-v8a
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/librootoperations.so'
          cp "$apk" "dist/$(basename "$apk" .apk)-arm64-v8a-$(git rev-parse --short HEAD).apk"
          ls -lh dist/

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
